name: Kitchensurfing
description: 'Kitchensurfing was a New York City marketplace that booked professional chefs to shop for,
  cook, and serve meals in customers'' own kitchens, founded in 2012 and backed by roughly $20M from Union
  Square Ventures, Spark Capital, and Tiger Global. It began as an advance-booking platform for private
  dinner parties and pivoted in 2015 to a flat-rate on-demand model in which a chef arrived and cooked
  dinner within a fixed window. Neither model produced sustainable demand against better-capitalized meal-kit
  and delivery competitors, and the company discontinued service and shut down on April 15, 2016. It never
  published a public developer API, SDK, or developer portal. Its GitHub organization survives with eleven
  public repositories - open-source Ruby/Rails forks and internal hackathon projects, last active in 2016
  - but contains no client library or API definition. The kitchensurfing.com domain was subsequently re-registered
  by an unrelated cooking-products affiliate publisher and no longer represents this company.'
